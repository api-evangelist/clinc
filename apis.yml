aid: clinc
name: Clinc
description: >-
  Clinc is a conversational AI platform for banking and financial services,
  founded in 2015 in Ann Arbor, Michigan. It provides the Natural Language
  Understanding (NLU), Natural Language Processing (NLP), and Natural Language
  Generation (NLG) engine behind virtual assistants and chatbots, and is
  ASR/TTS-agnostic so it can be connected to phone, mobile, web, or smart-speaker
  devices. Once a user utterance is converted to text, Clinc's AI engine
  interprets intent and calls the appropriate third-party systems (such as an
  external database) to answer or carry out an action. Clinc has been deployed
  with customers including USAA, Ford, Barclays, and İşbank, and is backed by
  Insight Partners, Drive Capital, and eLab Ventures. NOTE — Clinc's public
  developer surface (clinc.com and api.clinc.com) is offline as of 2026-07-18:
  the clinc.com AWS Route53 delegation is dangling and its authoritative
  nameservers return REFUSED, so the domain resolves SERVFAIL everywhere. The
  documentation and API URLs recorded here are the genuine published locations,
  recoverable via the Internet Archive.
